# =============================================================================
# grub.cfg -- GRUB bootloader menu
# =============================================================================
# Tells GRUB where to find our kernel and to boot it immediately using the
# Multiboot2 protocol. Copied into the ISO at /boot/grub/grub.cfg by `make
# iso` (see Makefile).
# =============================================================================
set timeout=0
set default=0

menuentry "MyOS" {
    multiboot2 /boot/kernel.bin
    boot
}
